<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>திருக்குறள் · Thirukkural Search</title>
<meta name="description" content="Search all 1330 kurals of the Thirukkural in Tamil and English — translations, transliterations, and the commentaries of Varadarajan, Salomon Papaiya, and Karunanidhi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --panel:#fffdfa; --ink:#221d16; --muted:#6d6255; --faint:#8d8275;
    --line:#e6ded1; --line-soft:#efe8dc; --accent:#9a3b1f; --accent-soft:#f3e2d8;
    --on-accent:#fffdfa;
    --mark:#ffe9a8; --mark-ink:#4a3708;
    --shadow:0 1px 2px rgba(60,45,25,.05),0 8px 24px -12px rgba(60,45,25,.18);
    --tamil:"Noto Sans Tamil",system-ui,sans-serif;
    --serif:"Source Serif 4",Georgia,serif;
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#15130f; --panel:#1d1a15; --ink:#ece5d9; --muted:#a2988a; --faint:#857b6d;
      --line:#2f2a22; --line-soft:#262119; --accent:#e2825c; --accent-soft:#3a251c;
      --on-accent:#15130f;
      --mark:#5c4611; --mark-ink:#ffe9a8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15130f; --panel:#1d1a15; --ink:#ece5d9; --muted:#a2988a; --faint:#857b6d;
    --line:#2f2a22; --line-soft:#262119; --accent:#e2825c; --accent-soft:#3a251c;
    --on-accent:#15130f;
    --mark:#5c4611; --mark-ink:#ffe9a8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}

  header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .masthead{padding:22px 0 0}
  h1{font-family:var(--tamil);font-size:1.65rem;font-weight:700;margin:0;letter-spacing:-.01em}
  h1 .latin{font-family:var(--serif);font-size:1.05rem;font-weight:400;color:var(--muted);margin-left:10px}
  .tagline{color:var(--muted);font-size:.875rem;margin:5px 0 16px}
  .tagline a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
  .tagline a:hover{border-bottom-color:var(--accent)}

  .searchrow{display:flex;gap:8px;align-items:center;padding-bottom:12px}
  .sbox{position:relative;flex:1}
  .sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
  #q{width:100%;font:inherit;font-size:1rem;padding:12px 40px 12px 40px;border-radius:10px;
     border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--tamil)}
  #q:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  #q::placeholder{color:var(--faint);font-family:var(--sans)}
  #q::-webkit-search-cancel-button{display:none}
  .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
         color:var(--faint);cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:6px;line-height:1}
  .clear:hover{background:var(--line-soft);color:var(--ink)}
  .iconbtn{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:9px;
           padding:11px 12px;cursor:pointer;font:inherit;font-size:.82rem;white-space:nowrap}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}

  .filters{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px;align-items:center}
  .chip{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:100px;
        padding:5px 13px;cursor:pointer;font:inherit;font-size:.8rem;font-family:var(--tamil)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
        color:var(--on-accent);font-weight:500}
  .chip:hover:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent)}
  select{font:inherit;font-size:.8rem;font-family:var(--tamil);padding:5px 8px;border-radius:8px;
         border:1px solid var(--line);background:var(--bg);color:var(--muted);max-width:250px}

  .status{font-size:.8rem;color:var(--faint);padding:14px 0 4px;min-height:20px}
  .status b{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .status a{color:var(--accent)}

  main{padding-bottom:60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
        margin:12px 0;box-shadow:var(--shadow);scroll-margin-top:210px}
  .card:target{outline:2px solid var(--accent);outline-offset:2px}
  .crumb{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:.72rem;color:var(--faint);
         margin-bottom:11px;font-family:var(--tamil)}
  .crumb .sep{opacity:.45}
  .crumb .ch-en{font-family:var(--serif);font-style:italic;opacity:.8}
  .crumb .num{font-family:var(--sans);font-weight:600;color:var(--accent);background:var(--accent-soft);
              border-radius:5px;padding:1px 7px;font-variant-numeric:tabular-nums}
  .kural{font-family:var(--tamil);font-size:1.24rem;line-height:1.72;font-weight:500;
         margin:0 0 9px;white-space:pre-line}
  .translit{font-family:var(--serif);font-style:italic;color:var(--faint);font-size:.86rem;
            line-height:1.6;margin:0 0 13px;white-space:pre-line}
  .en{font-family:var(--serif);font-size:1rem;line-height:1.65;margin:0 0 6px}
  .en.couplet{color:var(--muted);font-size:.94rem}
  details{margin-top:13px;border-top:1px solid var(--line-soft);padding-top:11px}
  summary{cursor:pointer;font-size:.78rem;color:var(--muted);list-style:none;display:flex;
          align-items:center;gap:6px;user-select:none;font-weight:500}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"\25B8";color:var(--faint);transition:transform .15s;display:inline-block}
  details[open] summary::before{transform:rotate(90deg)}
  summary:hover{color:var(--accent)}
  .urai{margin-top:12px}
  .urai h4{font-family:var(--tamil);font-size:.76rem;font-weight:600;color:var(--accent);margin:0 0 3px}
  .urai p{font-family:var(--tamil);font-size:.94rem;line-height:1.68;margin:0;color:var(--ink)}
  .urai p.latin{font-family:var(--serif)}
  mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}

  .more{display:block;width:100%;margin:18px 0;padding:12px;border:1px dashed var(--line);
        background:none;color:var(--muted);border-radius:10px;cursor:pointer;font:inherit;font-size:.85rem}
  .more:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
  .empty{text-align:center;padding:60px 20px;color:var(--faint)}
  .empty .big{font-family:var(--tamil);font-size:1.1rem;color:var(--muted);margin-bottom:6px}
  .empty code{background:var(--line-soft);padding:2px 6px;border-radius:4px;font-size:.85em}
  footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--faint);
         font-size:.78rem;text-align:center}
  footer a{color:var(--muted)}
  kbd{font-family:var(--sans);font-size:.72rem;border:1px solid var(--line);border-bottom-width:2px;
      border-radius:4px;padding:1px 5px;color:var(--muted);background:var(--bg)}
  @media (max-width:560px){
    h1{font-size:1.35rem} h1 .latin{display:block;margin:2px 0 0}
    .card{padding:15px 16px} .kural{font-size:1.12rem} .iconbtn span{display:none}
    .card{scroll-margin-top:240px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="masthead">
      <h1>திருக்குறள்<span class="latin">Thirukkural</span></h1>
      <p class="tagline">All 1330 couplets — searchable in Tamil and English.
        <a href="https://github.com/tk120404/thirukkural">JSON on GitHub</a></p>
    </div>
    <div class="searchrow">
      <div class="sbox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search Tamil or English — virtue, rain, 1330…" aria-label="Search kurals">
        <button class="clear" id="clear" hidden aria-label="Clear search">&#10005;</button>
      </div>
      <button class="iconbtn" id="rand" title="Show a random kural">&#127922;<span> Random</span></button>
      <button class="iconbtn" id="theme" title="Toggle light and dark theme" aria-label="Toggle theme">&#9680;</button>
    </div>
    <div class="filters" id="filters">
      <button class="chip" data-paal="0" aria-pressed="true">All</button>
      <select id="chapter" aria-label="Filter by chapter"></select>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="status" id="count">Loading the 1330 kurals…</div>
  <main id="results"></main>
</div>

<footer class="wrap">
  <p>Text and commentaries from
    <a href="https://github.com/tk120404/thirukkural">tk120404/thirukkural</a>.
    Press <kbd>/</kbd> to search.</p>
</footer>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var results = $("#results"), qEl = $("#q"), countEl = $("#count"),
      chapSel = $("#chapter"), filters = $("#filters"), clearBtn = $("#clear");

  var KURALS = [], byNumber = new Map(), paal = 0, chapter = "", shown = 0, matches = [];
  var PAGE = 40;

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  // The dataset is NFC-normalized, so normalize the query the same way or
  // Tamil input from a different IME silently fails to match.
  function norm(s){ return s.normalize("NFC").toLowerCase(); }

  /* theme ---------------------------------------------------------------- */
  var saved = null;
  try { saved = localStorage.getItem("tk-theme"); } catch(e){}
  if(saved) document.documentElement.dataset.theme = saved;
  $("#theme").addEventListener("click", function(){
    var cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("tk-theme", next); } catch(e){}
  });

  /* load ----------------------------------------------------------------- */
  function grab(f){
    return fetch(f).then(function(r){
      if(!r.ok) throw new Error(f + " — HTTP " + r.status);
      return r.json();
    });
  }

  Promise.all([grab("thirukkural.json"), grab("detail.json")]).then(function(res){
    var kd = res[0], dd = res[1];
    KURALS = kd.kural;

    // Flatten பால் → இயல் → அதிகாரம். Each chapter owns an inclusive
    // start..end range of kural numbers, which is the join to thirukkural.json.
    var sections = dd[0].section.detail;
    var opts = ['<option value="">அதிகாரம் — all 133 chapters</option>'];
    sections.forEach(function(sec){
      sec.chapterGroup.detail.forEach(function(grp){
        grp.chapters.detail.forEach(function(ch){
          var meta = { num:ch.number, name:ch.name, en:ch.translation, tr:ch.transliteration,
                       iyal:grp.name, paal:sec.name, paalNum:sec.number, paalEn:sec.translation };
          for(var n = ch.start; n <= ch.end; n++) byNumber.set(n, meta);
          opts.push('<option value="' + ch.number + '">' + ch.number + ". " +
                    esc(ch.name) + " — " + esc(ch.translation) + "</option>");
        });
      });
    });
    chapSel.innerHTML = opts.join("");

    // Paal chips, derived from the data rather than hardcoded.
    sections.forEach(function(sec){
      var b = document.createElement("button");
      b.className = "chip";
      b.dataset.paal = sec.number;
      b.setAttribute("aria-pressed", "false");
      b.textContent = sec.name;
      b.title = sec.translation;
      filters.insertBefore(b, chapSel);
    });

    // One lowercase NFC haystack per kural, built once. It holds only what the
    // card actually displays, so every hit can be seen. Section names are
    // deliberately absent: matching the paal's English name ("Virtue") returned
    // all 380 of its kurals with nothing highlighted anywhere. Use the chips
    // to filter by section instead.
    KURALS.forEach(function(k){
      var ch = byNumber.get(k.Number) || {};
      k._ch = ch;
      k._h = norm([k.Number, k.Line1, k.Line2, k.Translation, k.couplet, k.explanation,
                   k.mv, k.sp, k.mk, k.transliteration1, k.transliteration2,
                   ch.name, ch.en, ch.iyal, ch.paal].join("  "));
    });

    var p = new URLSearchParams(location.search);
    if(p.get("q")) qEl.value = p.get("q");
    run();
    var m = /^#kural-(\d+)$/.exec(location.hash);
    if(m) setTimeout(function(){
      var el = document.getElementById("kural-" + m[1]);
      if(el) el.scrollIntoView({ block:"center" });
    }, 80);
  }).catch(function(err){
    countEl.textContent = "";
    results.innerHTML = '<div class="empty"><div class="big">Could not load the data.</div>' +
      "<p>" + esc(err.message) + "</p>" +
      "<p>If you opened this file straight from disk, browsers block the fetch. " +
      "Run <code>python3 -m http.server</code> in the repo and open " +
      "<code>localhost:8000</code> instead.</p></div>";
  });

  /* search --------------------------------------------------------------- */
  function terms(){
    return norm(qEl.value.trim()).split(/\s+/).filter(Boolean);
  }

  function search(){
    var ts = terms();
    return KURALS.filter(function(k){
      if(paal && k._ch.paalNum !== paal) return false;
      if(chapter && String(k._ch.num) !== chapter) return false;
      for(var i = 0; i < ts.length; i++){
        if(k._h.indexOf(ts[i]) === -1) return false;
      }
      return true;
    });
  }

  // Escape first, then locate matches on a normalized copy of the *escaped*
  // string so the slice indices line up with what actually gets inserted.
  function hl(text){
    var safe = esc(text);
    // The haystack is escaped, so escape the terms too — otherwise a query
    // holding & or " matches in search() but never highlights here.
    var ts = terms().map(function(t){ return norm(esc(t)); });
    if(!ts.length) return safe;
    var hay = norm(safe), spans = [];
    ts.forEach(function(t){
      var i = hay.indexOf(t);
      while(i !== -1){ spans.push([i, i + t.length]); i = hay.indexOf(t, i + t.length); }
    });
    if(!spans.length) return safe;
    spans.sort(function(a,b){ return a[0] - b[0]; });
    var merged = [];
    spans.forEach(function(s){
      var last = merged[merged.length - 1];
      if(last && s[0] <= last[1]) last[1] = Math.max(last[1], s[1]);
      else merged.push([s[0], s[1]]);
    });
    var out = "", pos = 0;
    merged.forEach(function(m){
      out += safe.slice(pos, m[0]) + "<mark>" + safe.slice(m[0], m[1]) + "</mark>";
      pos = m[1];
    });
    return out + safe.slice(pos);
  }

  function card(k){
    var c = k._ch;
    var urai = [["மு. வரதராசனார்", k.mv], ["சாலமன் பாப்பையா", k.sp], ["மு. கருணாநிதி", k.mk]]
      .filter(function(p){ return p[1]; })
      .map(function(p){
        return '<div class="urai"><h4>' + p[0] + "</h4><p>" + hl(p[1]) + "</p></div>";
      }).join("");
    return '<article class="card" id="kural-' + k.Number + '">' +
      '<div class="crumb"><span class="num">' + k.Number + "</span>" +
        "<span>" + hl(c.paal || "") + '</span><span class="sep">&rsaquo;</span>' +
        "<span>" + hl(c.iyal || "") + '</span><span class="sep">&rsaquo;</span>' +
        "<span>" + hl(c.name || "") +
          '<span class="ch-en"> · ' + hl(c.en || "") + "</span></span></div>" +
      '<p class="kural">' + hl(k.Line1) + "\n" + hl(k.Line2) + "</p>" +
      '<p class="translit">' + hl(k.transliteration1) + "\n" + hl(k.transliteration2) + "</p>" +
      '<p class="en">' + hl(k.Translation) + "</p>" +
      '<p class="en couplet">' + hl(k.couplet) + "</p>" +
      "<details><summary>உரை · commentary and explanation</summary>" +
        '<div class="urai"><h4>Explanation</h4><p class="latin">' + hl(k.explanation) + "</p></div>" +
        urai +
      "</details></article>";
  }

  function render(reset){
    if(reset){ results.innerHTML = ""; shown = 0; }
    var btn = results.querySelector(".more");
    if(btn) btn.remove();
    var slice = matches.slice(shown, shown + PAGE);
    results.insertAdjacentHTML("beforeend", slice.map(card).join(""));
    shown += slice.length;
    var left = matches.length - shown;
    if(left > 0){
      results.insertAdjacentHTML("beforeend",
        '<button class="more">Show ' + Math.min(PAGE, left) + " more · " + left + " remaining</button>");
    }
  }

  function run(){
    matches = search();
    var q = qEl.value.trim();
    clearBtn.hidden = !q;

    var url = q ? "?q=" + encodeURIComponent(q) : location.pathname;
    history.replaceState(null, "", url);

    if(!matches.length){
      countEl.textContent = "";
      results.innerHTML = '<div class="empty"><div class="big">No kurals found.</div>' +
        "<p>Try another word, or search by number (1–1330).</p></div>";
      return;
    }
    countEl.innerHTML = "<b>" + matches.length + "</b> " +
      (matches.length === 1 ? "kural" : "kurals") +
      (q ? " matching “" + esc(q) + "”" : "");
    render(true);
  }

  /* events --------------------------------------------------------------- */
  var t;
  qEl.addEventListener("input", function(){ clearTimeout(t); t = setTimeout(run, 110); });
  clearBtn.addEventListener("click", function(){ qEl.value = ""; qEl.focus(); run(); });
  results.addEventListener("click", function(e){
    if(e.target.classList.contains("more")) render(false);
  });
  chapSel.addEventListener("change", function(){ chapter = chapSel.value; run(); });
  filters.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if(!chip) return;
    paal = Number(chip.dataset.paal);
    var all = filters.querySelectorAll(".chip");
    for(var i = 0; i < all.length; i++){
      all[i].setAttribute("aria-pressed", all[i] === chip ? "true" : "false");
    }
    run();
  });
  $("#rand").addEventListener("click", function(){
    if(!KURALS.length) return;
    qEl.value = ""; paal = 0; chapter = ""; chapSel.value = "";
    var all = filters.querySelectorAll(".chip");
    for(var i = 0; i < all.length; i++){
      all[i].setAttribute("aria-pressed", all[i].dataset.paal === "0" ? "true" : "false");
    }
    var n = 1 + Math.floor(Math.random() * KURALS.length);
    matches = [KURALS[n - 1]];
    clearBtn.hidden = true;
    countEl.innerHTML = "Kural <b>" + n + '</b> — <a href="#" id="showall">show all 1330</a>';
    render(true);
    history.replaceState(null, "", "#kural-" + n);
  });
  countEl.addEventListener("click", function(e){
    if(e.target.id === "showall"){ e.preventDefault(); run(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "/" && document.activeElement !== qEl){
      e.preventDefault(); qEl.focus(); qEl.select();
    }
    if(e.key === "Escape" && document.activeElement === qEl){ qEl.value = ""; run(); }
  });
})();
</script>
</body>
</html>
